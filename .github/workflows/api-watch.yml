name: api-watch
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check API contracts
        run: node watch.mjs check examples/contracts.json --json api-report.json --md api-report.md --fail-on breaking
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-watch-report
          path: api-report.*
